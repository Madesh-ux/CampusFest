{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>CampusFest</title>
    <link rel="stylesheet" href="{% static 'events/css/style.css' %}">
</head>

<body>

    <nav>
        <h2><a href="{% url 'home' %}">CampusFest</a></h2>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
                <span>Hi, {{ user.username }}</span>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:signup' %}">Sign up</a>
                <a href="{% url 'accounts:login' %}">Log in</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>CampusFest © 2026</p>
    </footer>

</body>
</html>
