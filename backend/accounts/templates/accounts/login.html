{% extends "base.html" %}

{% block content %}
<h1>Student log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <button type="submit">Log in</button>
</form>
<p>New to CampusFest? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
{% endblock %}
